# Demo stack: Prometheus + Blackbox exporter + promui.
#
#   docker compose up -d --build
#
#   prometheus          http://localhost:9090
#   blackbox-exporter   http://localhost:9115
#   promui              http://localhost:8080
#
# promui edits the files in ./files_sd (bind-mounted into both containers);
# Prometheus picks the changes up automatically (files_sd refresh interval)
# without a restart.

services:
  prometheus:
    image: prom/prometheus:v3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Where the file_sd directory lives inside THIS container.
      # promui sees the same directory as /data/files_sd (see below).
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./files_sd:/etc/prometheus/files_sd
      - prometheus_data:/prometheus
    depends_on:
      - blackbox-exporter
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    # ICMP probes need raw sockets.
    cap_add:
      - NET_RAW
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    restart: unless-stopped

  promui:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: "dev"
    environment:
      # Inside the promui container the files_sd directory is /data/files_sd
      # (bind-mounted from ./files_sd); Prometheus mounts the same directory
      # as /etc/prometheus/files_sd, and that is the prefix used in the
      # prometheus.yml globs.
      PROMUI_FILES_SD_DIR: /data/files_sd
      PROMUI_FILES_SD_MOUNT: /etc/prometheus/files_sd
      PROMUI_PROMETHEUS_URL: http://prometheus:9090
      PROMUI_LISTEN: 0.0.0.0:8080
      # To enable Basic Auth, uncomment and provide the file:
      PROMUI_HTPASSWD: /etc/promui/htpasswd
    ports:
      - "8080:8080"
    volumes:
      # The examples from ./files_sd are right there from the first start;
      # edits in the UI land directly in this host directory.
      - ./files_sd:/data/files_sd
      # Example htaccess file login "admin" password "secret"
      # > htpasswd -B -c htaccess admin
      - ./htaccess:/etc/promui/htpasswd
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
